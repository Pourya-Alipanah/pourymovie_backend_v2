# ---------------------------------------------- General Application Configuration
spring:
  application:
    name: pourymovie_backend_v2
  main:
    banner-mode: off
  servlet:
    multipart:
      max-file-size: "${MINIO_MAX_FILE_SIZE_IN_GB}GB"
      max-request-size: "${MINIO_MAX_FILE_SIZE_IN_GB}GB"
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  # ----------------------------------------------- DB Configuration
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        cache:
          use_second_level_cache: true
          redisson:
            config: classpath:redisson.yaml
          region:
            factory_class: org.redisson.hibernate.RedissonRegionFactory

# ----------------------------------------------- Google OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile,email

server:
  port: 1406
  servlet:
    context-path: /v2

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE

# ----------------------------------------------- Swagger Configuration
springdoc:
  api-docs:
    path: /apiDocs-json
  swagger-ui:
    path: /apiDocs
    operationsSorter: method
    with-credentials: true

# ----------------------------------------------- App Defaults
pourymovie:
  default-page-size: 10
  default-page-number: 0
  # 60 minutes for access token
  default-access-token-t-tl-in-minutes: 60
  # 30 days for refresh token
  default-refresh-token-t-tl-in-minutes: 43200
  jwt-secret-key: ${JWT_SECRET_KEY}
  public-paths: /auth/**,/public/**,/apiDocs/**,/apiDocs-json/**,/swagger-ui**/**,/login/oauth2/**,/oauth2/**
  frontend-url: ${FRONTEND_URL}
  frontend-oauth-redirect-url: ${FRONTEND_OAUTH_REDIRECT_URL}
  frontend-movie-path: ${FRONTEND_MOVIE_PATH}
  frontend-series-path: ${FRONTEND_SERIES_PATH}

  # ----------------------------------------------- MinIO Configuration
  minio-url: ${MINIO_URL}
  minio-access-key: ${MINIO_ACCESS_KEY}
  minio-secret-key: ${MINIO_SECRET_KEY}
  minio-port: ${MINIO_PORT}
  minio-secure: ${MINIO_USE_SSL}
  minio-expiration-in-minutes: ${MINIO_URL_EXPIRATION_MINUTES}
  minio-temp-upload-dir: ${MINIO_TEMP_UPLOAD_DIR}

  # ----------------------------------------------- Gemini Configuration
  gemini-api-key: ${GEMINI_API_KEY}
  gemini-model-name: ${GEMINI_MODEL_NAME}